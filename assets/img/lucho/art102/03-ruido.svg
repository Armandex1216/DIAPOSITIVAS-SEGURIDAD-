<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400">
<style>
text{font-family:'Montserrat','Segoe UI','Arial Black',Arial,sans-serif}
.in{animation:in .7s cubic-bezier(.2,.8,.2,1) both}
.chip{animation:chip .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes chip{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
.ic{transform-origin:200px 200px;animation:pop .8s cubic-bezier(.2,.8,.2,1) both}
</style>
<g class="ic"><circle cx="200" cy="200" r="170" fill="#fff" stroke="#c39531" stroke-width="6"/><circle cx="200" cy="200" r="150" fill="#e8731a" opacity=".08"/>
<g><path d="M92 165 h46 l58 -50 v170 l-58 -50 h-46 z" fill="#1a1917"/><animateTransform attributeName="transform" type="translate" values="0 0;-3 0;3 0;0 0" dur=".25s" repeatCount="indefinite"/></g><path d="M238 150 Q268 200 238 250" fill="none" stroke="#e8731a" stroke-width="9" stroke-linecap="round" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="1.5s" begin="0.0s" repeatCount="indefinite"/></path><path d="M268 134 Q304 200 268 266" fill="none" stroke="#e8731a" stroke-width="9" stroke-linecap="round" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="1.5s" begin="0.3s" repeatCount="indefinite"/></path><path d="M298 118 Q340 200 298 282" fill="none" stroke="#e8731a" stroke-width="9" stroke-linecap="round" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="1.5s" begin="0.6s" repeatCount="indefinite"/></path>
<text x="200" y="345" text-anchor="middle" font-size="30" font-weight="900" fill="#d4402b">dB ↑</text></g>
<g class="in" style="animation-delay:.15s"><rect x="430" y="40" width="140" height="38" rx="8" fill="#e8731a"/><text x="442" y="67" font-size="20" font-weight="800" fill="#fff" letter-spacing="1.5">AGENTE 1</text></g>
<text class="in" style="animation-delay:.25s" x="430" y="140" font-size="58" font-weight="900" fill="#1a1917">Ruido</text>
<text class="in" style="animation-delay:.35s" x="432" y="188" font-size="24" font-weight="600" fill="#6b6457">Perforadoras, chancadoras, compresoras</text>
<g class="chip" style="animation-delay:0.5s"><rect x="430" y="228" width="505" height="42" rx="21" fill="#fff" stroke="#e8731a" stroke-width="2.5"/>
<circle cx="452" cy="249" r="9" fill="#e8731a"/><path d="M447 249 l4 4 l7 -8" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="472" y="257" font-size="21" font-weight="700" fill="#1a1917">¿Gritas a 1 metro? Hay mucho ruido</text></g><g class="chip" style="animation-delay:0.85s"><rect x="430" y="282" width="470" height="42" rx="21" fill="#fff" stroke="#e8731a" stroke-width="2.5"/>
<circle cx="452" cy="303" r="9" fill="#e8731a"/><path d="M447 303 l4 4 l7 -8" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="472" y="311" font-size="21" font-weight="700" fill="#1a1917">Usa tapones u orejeras SIEMPRE</text></g><g class="chip" style="animation-delay:1.2s"><rect x="430" y="336" width="457" height="42" rx="21" fill="#fff" stroke="#e8731a" stroke-width="2.5"/>
<circle cx="452" cy="357" r="9" fill="#e8731a"/><path d="M447 357 l4 4 l7 -8" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="472" y="365" font-size="21" font-weight="700" fill="#1a1917">El daño al oído no tiene cura</text></g>
</svg>