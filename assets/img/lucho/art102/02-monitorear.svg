<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400">
<style>
text{font-family:'Montserrat','Segoe UI','Arial Black',Arial,sans-serif}
.in{animation:in .7s cubic-bezier(.2,.8,.2,1) both}
.chip{animation:chip .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes chip{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
.ic{transform-origin:200px 200px;animation:pop .8s cubic-bezier(.2,.8,.2,1) both}
</style>
<g class="ic"><circle cx="200" cy="200" r="170" fill="#fff" stroke="#c39531" stroke-width="6"/><circle cx="200" cy="200" r="150" fill="#3a8f5c" opacity=".08"/>
<path d="M90 210 A110 110 0 0 1 310 210" fill="none" stroke="#e6dcc4" stroke-width="26"/>
<path d="M90 210 A110 110 0 0 1 166 105" fill="none" stroke="#3aa35b" stroke-width="26"/><path d="M166 105 A110 110 0 0 1 256 115" fill="none" stroke="#c39531" stroke-width="26"/><path d="M256 115 A110 110 0 0 1 310 210" fill="none" stroke="#d4402b" stroke-width="26"/>
<line x1="200" y1="92" x2="200" y2="116" stroke="#1a1917" stroke-width="4" transform="rotate(-90 200 210)"/><line x1="200" y1="92" x2="200" y2="108" stroke="#1a1917" stroke-width="4" transform="rotate(-72 200 210)"/><line x1="200" y1="92" x2="200" y2="116" stroke="#1a1917" stroke-width="4" transform="rotate(-54 200 210)"/><line x1="200" y1="92" x2="200" y2="108" stroke="#1a1917" stroke-width="4" transform="rotate(-36 200 210)"/><line x1="200" y1="92" x2="200" y2="116" stroke="#1a1917" stroke-width="4" transform="rotate(-18 200 210)"/><line x1="200" y1="92" x2="200" y2="108" stroke="#1a1917" stroke-width="4" transform="rotate(0 200 210)"/><line x1="200" y1="92" x2="200" y2="116" stroke="#1a1917" stroke-width="4" transform="rotate(18 200 210)"/><line x1="200" y1="92" x2="200" y2="108" stroke="#1a1917" stroke-width="4" transform="rotate(36 200 210)"/><line x1="200" y1="92" x2="200" y2="116" stroke="#1a1917" stroke-width="4" transform="rotate(54 200 210)"/><line x1="200" y1="92" x2="200" y2="108" stroke="#1a1917" stroke-width="4" transform="rotate(72 200 210)"/><line x1="200" y1="92" x2="200" y2="116" stroke="#1a1917" stroke-width="4" transform="rotate(90 200 210)"/><g><line x1="200" y1="210" x2="200" y2="118" stroke="#1a1917" stroke-width="8" stroke-linecap="round"/><animateTransform attributeName="transform" type="rotate" values="-70 200 210;30 200 210;5 200 210;55 200 210;-70 200 210" dur="4s" repeatCount="indefinite"/></g>
<circle cx="200" cy="210" r="16" fill="#1a1917"/><rect x="128" y="250" width="144" height="54" rx="12" fill="#1a1917"/><text x="200" y="287" text-anchor="middle" font-size="28" font-weight="800" fill="#7CFF9A">MIDE<animate attributeName="opacity" values="1;.3;1" dur="1.2s" repeatCount="indefinite"/></text></g>
<g class="in" style="animation-delay:.15s"><rect x="430" y="40" width="212" height="38" rx="8" fill="#3a8f5c"/><text x="442" y="67" font-size="20" font-weight="800" fill="#fff" letter-spacing="1.5">LA OBLIGACIÓN</text></g>
<text class="in" style="animation-delay:.25s" x="430" y="140" font-size="58" font-weight="900" fill="#1a1917">Monitorear</text>
<text class="in" style="animation-delay:.35s" x="432" y="188" font-size="24" font-weight="600" fill="#6b6457">El titular minero mide los agentes físicos</text>
<g class="chip" style="animation-delay:0.5s"><rect x="430" y="228" width="470" height="42" rx="21" fill="#fff" stroke="#3a8f5c" stroke-width="2.5"/>
<circle cx="452" cy="249" r="9" fill="#3a8f5c"/><path d="M447 249 l4 4 l7 -8" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="472" y="257" font-size="21" font-weight="700" fill="#1a1917">Se mide con equipos calibrados</text></g><g class="chip" style="animation-delay:0.85s"><rect x="430" y="282" width="505" height="42" rx="21" fill="#fff" stroke="#3a8f5c" stroke-width="2.5"/>
<circle cx="452" cy="303" r="9" fill="#3a8f5c"/><path d="M447 303 l4 4 l7 -8" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="472" y="311" font-size="21" font-weight="700" fill="#1a1917">En la labor y en actividades conexas</text></g><g class="chip" style="animation-delay:1.2s"><rect x="430" y="336" width="483" height="42" rx="21" fill="#fff" stroke="#3a8f5c" stroke-width="2.5"/>
<circle cx="452" cy="357" r="9" fill="#3a8f5c"/><path d="M447 357 l4 4 l7 -8" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="472" y="365" font-size="21" font-weight="700" fill="#1a1917">Si pasa el límite → se controla</text></g>
</svg>