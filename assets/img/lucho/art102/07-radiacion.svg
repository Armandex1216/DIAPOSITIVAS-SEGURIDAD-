<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400">
<style>
text{font-family:'Montserrat','Segoe UI','Arial Black',Arial,sans-serif}
.in{animation:in .7s cubic-bezier(.2,.8,.2,1) both}
.chip{animation:chip .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes chip{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
.ic{transform-origin:200px 200px;animation:pop .8s cubic-bezier(.2,.8,.2,1) both}
</style>
<g class="ic"><circle cx="200" cy="200" r="170" fill="#fff" stroke="#c39531" stroke-width="6"/><circle cx="200" cy="200" r="150" fill="#c09000" opacity=".08"/>
<circle cx="200" cy="200" r="118" fill="#f4c400"/><g><path d="M200 200 L150.0 113.4 A100 100 0 0 1 250.0 113.4 Z" fill="#1a1917"/><path d="M200 200 L300.0 200.0 A100 100 0 0 1 250.0 286.6 Z" fill="#1a1917"/><path d="M200 200 L150.0 286.6 A100 100 0 0 1 100.0 200.0 Z" fill="#1a1917"/><animateTransform attributeName="transform" type="rotate" from="0 200 200" to="360 200 200" dur="10s" repeatCount="indefinite"/></g>
<circle cx="200" cy="200" r="30" fill="#f4c400"/><circle cx="200" cy="200" r="20" fill="#1a1917"/>
<circle cx="200" cy="200" r="130" fill="none" stroke="#d4402b" stroke-width="5"><animate attributeName="r" values="122;160" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.8s" repeatCount="indefinite"/></circle></g>
<g class="in" style="animation-delay:.15s"><rect x="430" y="40" width="140" height="38" rx="8" fill="#c09000"/><text x="442" y="67" font-size="20" font-weight="800" fill="#fff" letter-spacing="1.5">AGENTE 5</text></g>
<text class="in" style="animation-delay:.25s" x="430" y="140" font-size="36" font-weight="900" fill="#1a1917">Radiaciones ionizantes</text>
<text class="in" style="animation-delay:.35s" x="432" y="188" font-size="24" font-weight="600" fill="#6b6457">Densímetros nucleares y equipos de rayos X</text>
<g class="chip" style="animation-delay:0.5s"><rect x="430" y="228" width="444" height="42" rx="21" fill="#fff" stroke="#c09000" stroke-width="2.5"/>
<circle cx="452" cy="249" r="9" fill="#c09000"/><path d="M447 249 l4 4 l7 -8" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="472" y="257" font-size="21" font-weight="700" fill="#1a1917">Respeta el símbolo y la zona</text></g><g class="chip" style="animation-delay:0.85s"><rect x="430" y="282" width="391" height="42" rx="21" fill="#fff" stroke="#c09000" stroke-width="2.5"/>
<circle cx="452" cy="303" r="9" fill="#c09000"/><path d="M447 303 l4 4 l7 -8" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="472" y="311" font-size="21" font-weight="700" fill="#1a1917">Solo personal autorizado</text></g><g class="chip" style="animation-delay:1.2s"><rect x="430" y="336" width="457" height="42" rx="21" fill="#fff" stroke="#c09000" stroke-width="2.5"/>
<circle cx="452" cy="357" r="9" fill="#c09000"/><path d="M447 357 l4 4 l7 -8" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="472" y="365" font-size="21" font-weight="700" fill="#1a1917">No toques ni muevas la fuente</text></g>
</svg>