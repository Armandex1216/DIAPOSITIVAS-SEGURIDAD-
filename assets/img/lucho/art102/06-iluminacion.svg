<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400">
<style>
text{font-family:'Montserrat','Segoe UI','Arial Black',Arial,sans-serif}
.in{animation:in .7s cubic-bezier(.2,.8,.2,1) both}
.chip{animation:chip .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes chip{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
.ic{transform-origin:200px 200px;animation:pop .8s cubic-bezier(.2,.8,.2,1) both}
</style>
<g class="ic"><circle cx="200" cy="200" r="170" fill="#fff" stroke="#c39531" stroke-width="6"/><circle cx="200" cy="200" r="150" fill="#d8a200" opacity=".08"/>
<g><line x1="200" y1="64" x2="200" y2="40" stroke="#f4b400" stroke-width="8" stroke-linecap="round" transform="rotate(-80 200 160)"/><line x1="200" y1="64" x2="200" y2="40" stroke="#f4b400" stroke-width="8" stroke-linecap="round" transform="rotate(-48 200 160)"/><line x1="200" y1="64" x2="200" y2="40" stroke="#f4b400" stroke-width="8" stroke-linecap="round" transform="rotate(-16 200 160)"/><line x1="200" y1="64" x2="200" y2="40" stroke="#f4b400" stroke-width="8" stroke-linecap="round" transform="rotate(16 200 160)"/><line x1="200" y1="64" x2="200" y2="40" stroke="#f4b400" stroke-width="8" stroke-linecap="round" transform="rotate(48 200 160)"/><line x1="200" y1="64" x2="200" y2="40" stroke="#f4b400" stroke-width="8" stroke-linecap="round" transform="rotate(80 200 160)"/><animate attributeName="opacity" values=".25;1;.25" dur="1.6s" repeatCount="indefinite"/></g>
<circle cx="200" cy="160" r="62" fill="#ffe27a" stroke="#1a1917" stroke-width="6"><animate attributeName="fill" values="#fff3b8;#ffd23f;#fff3b8" dur="1.6s" repeatCount="indefinite"/></circle>
<path d="M176 196 q24 20 48 0" fill="none" stroke="#1a1917" stroke-width="5"/><rect x="172" y="222" width="56" height="20" rx="4" fill="#8a8577"/><rect x="176" y="244" width="48" height="16" rx="4" fill="#5a554b"/><rect x="186" y="262" width="28" height="12" rx="4" fill="#1a1917"/>
<text x="200" y="330" text-anchor="middle" font-size="26" font-weight="900" fill="#1a1917">LUX ✓</text></g>
<g class="in" style="animation-delay:.15s"><rect x="430" y="40" width="140" height="38" rx="8" fill="#d8a200"/><text x="442" y="67" font-size="20" font-weight="800" fill="#fff" letter-spacing="1.5">AGENTE 4</text></g>
<text class="in" style="animation-delay:.25s" x="430" y="140" font-size="58" font-weight="900" fill="#1a1917">Iluminación</text>
<text class="in" style="animation-delay:.35s" x="432" y="188" font-size="24" font-weight="600" fill="#6b6457">Ver bien es trabajar seguro</text>
<g class="chip" style="animation-delay:0.5s"><rect x="430" y="228" width="483" height="42" rx="21" fill="#fff" stroke="#d8a200" stroke-width="2.5"/>
<circle cx="452" cy="249" r="9" fill="#d8a200"/><path d="M447 249 l4 4 l7 -8" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="472" y="257" font-size="21" font-weight="700" fill="#1a1917">Lámpara cargada antes de entrar</text></g><g class="chip" style="animation-delay:0.85s"><rect x="430" y="282" width="505" height="42" rx="21" fill="#fff" stroke="#d8a200" stroke-width="2.5"/>
<circle cx="452" cy="303" r="9" fill="#d8a200"/><path d="M447 303 l4 4 l7 -8" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="472" y="311" font-size="21" font-weight="700" fill="#1a1917">Reporta zonas oscuras o focos quemados</text></g><g class="chip" style="animation-delay:1.2s"><rect x="430" y="336" width="457" height="42" rx="21" fill="#fff" stroke="#d8a200" stroke-width="2.5"/>
<circle cx="452" cy="357" r="9" fill="#d8a200"/><path d="M447 357 l4 4 l7 -8" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="472" y="365" font-size="21" font-weight="700" fill="#1a1917">Poca luz = tropiezos y golpes</text></g>
</svg>