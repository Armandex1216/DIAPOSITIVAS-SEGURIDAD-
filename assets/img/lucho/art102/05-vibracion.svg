<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400">
<style>
text{font-family:'Montserrat','Segoe UI','Arial Black',Arial,sans-serif}
.in{animation:in .7s cubic-bezier(.2,.8,.2,1) both}
.chip{animation:chip .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes chip{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
.ic{transform-origin:200px 200px;animation:pop .8s cubic-bezier(.2,.8,.2,1) both}
</style>
<g class="ic"><circle cx="200" cy="200" r="170" fill="#fff" stroke="#c39531" stroke-width="6"/><circle cx="200" cy="200" r="150" fill="#7a5bd0" opacity=".08"/>
<g><animateTransform attributeName="transform" type="translate" values="0 0;-5 2;5 -2;-4 -1;4 1;0 0" dur=".3s" repeatCount="indefinite"/>
<rect x="90" y="150" width="170" height="60" rx="14" fill="#1a1917"/><rect x="110" y="120" width="70" height="34" rx="8" fill="#c39531"/><rect x="258" y="168" width="70" height="24" rx="6" fill="#8a8577"/><path d="M328 172 l22 8 l-22 8 z" fill="#8a8577"/>
<rect x="150" y="210" width="26" height="90" rx="8" fill="#5a554b"/></g>
<path d="M100 330 l20 -18 l20 18 l20 -18 l20 18 l20 -18 l20 18 l20 -18 l20 18 l20 -18" fill="none" stroke="#e8731a" stroke-width="6" stroke-linejoin="round"><animate attributeName="stroke-dashoffset" from="0" to="-80" dur=".6s" repeatCount="indefinite"/><animate attributeName="stroke-dasharray" values="40 0" dur="1s"/></path></g>
<g class="in" style="animation-delay:.15s"><rect x="430" y="40" width="140" height="38" rx="8" fill="#7a5bd0"/><text x="442" y="67" font-size="20" font-weight="800" fill="#fff" letter-spacing="1.5">AGENTE 3</text></g>
<text class="in" style="animation-delay:.25s" x="430" y="140" font-size="58" font-weight="900" fill="#1a1917">Vibraciones</text>
<text class="in" style="animation-delay:.35s" x="432" y="188" font-size="24" font-weight="600" fill="#6b6457">Mano-brazo y cuerpo entero</text>
<g class="chip" style="animation-delay:0.5s"><rect x="430" y="228" width="470" height="42" rx="21" fill="#fff" stroke="#7a5bd0" stroke-width="2.5"/>
<circle cx="452" cy="249" r="9" fill="#7a5bd0"/><path d="M447 249 l4 4 l7 -8" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="472" y="257" font-size="21" font-weight="700" fill="#1a1917">Perforadoras, scoop, volquetes</text></g><g class="chip" style="animation-delay:0.85s"><rect x="430" y="282" width="483" height="42" rx="21" fill="#fff" stroke="#7a5bd0" stroke-width="2.5"/>
<circle cx="452" cy="303" r="9" fill="#7a5bd0"/><path d="M447 303 l4 4 l7 -8" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="472" y="311" font-size="21" font-weight="700" fill="#1a1917">Asiento y equipo en buen estado</text></g><g class="chip" style="animation-delay:1.2s"><rect x="430" y="336" width="505" height="42" rx="21" fill="#fff" stroke="#7a5bd0" stroke-width="2.5"/>
<circle cx="452" cy="357" r="9" fill="#7a5bd0"/><path d="M447 357 l4 4 l7 -8" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="472" y="365" font-size="21" font-weight="700" fill="#1a1917">Rota tareas, no te expongas de más</text></g>
</svg>