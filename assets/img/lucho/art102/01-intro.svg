<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400">
<style>
text{font-family:'Montserrat','Segoe UI','Arial Black',Arial,sans-serif}
.in{animation:in .7s cubic-bezier(.2,.8,.2,1) both}
.chip{animation:chip .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes chip{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
.ic{transform-origin:200px 200px;animation:pop .8s cubic-bezier(.2,.8,.2,1) both}
</style>
<g class="ic"><circle cx="200" cy="200" r="170" fill="#fff" stroke="#c39531" stroke-width="6"/><circle cx="200" cy="200" r="150" fill="#c39531" opacity=".08"/>
<g><animateTransform attributeName="transform" type="rotate" from="0 200 200" to="360 200 200" dur="18s" repeatCount="indefinite"/><g transform="rotate(0 200 200)"><g transform="translate(200 72)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="18s" repeatCount="indefinite"/><circle r="30" fill="#fff" stroke="#c39531" stroke-width="3"/><text y="11" text-anchor="middle" font-size="30">🔊</text></g></g></g><g transform="rotate(72 200 200)"><g transform="translate(200 72)"><g><animateTransform attributeName="transform" type="rotate" from="-72" to="-432" dur="18s" repeatCount="indefinite"/><circle r="30" fill="#fff" stroke="#c39531" stroke-width="3"/><text y="11" text-anchor="middle" font-size="30">🌡</text></g></g></g><g transform="rotate(144 200 200)"><g transform="translate(200 72)"><g><animateTransform attributeName="transform" type="rotate" from="-144" to="-504" dur="18s" repeatCount="indefinite"/><circle r="30" fill="#fff" stroke="#c39531" stroke-width="3"/><text y="11" text-anchor="middle" font-size="30">〰</text></g></g></g><g transform="rotate(216 200 200)"><g transform="translate(200 72)"><g><animateTransform attributeName="transform" type="rotate" from="-216" to="-576" dur="18s" repeatCount="indefinite"/><circle r="30" fill="#fff" stroke="#c39531" stroke-width="3"/><text y="11" text-anchor="middle" font-size="30">💡</text></g></g></g><g transform="rotate(288 200 200)"><g transform="translate(200 72)"><g><animateTransform attributeName="transform" type="rotate" from="-288" to="-648" dur="18s" repeatCount="indefinite"/><circle r="30" fill="#fff" stroke="#c39531" stroke-width="3"/><text y="11" text-anchor="middle" font-size="30">☢</text></g></g></g></g>
<circle cx="200" cy="200" r="66" fill="#1a1917"/><text x="200" y="192" text-anchor="middle" font-size="24" font-weight="800" fill="#c39531">ART.</text><text x="200" y="232" text-anchor="middle" font-size="46" font-weight="900" fill="#fff">102</text>
<circle cx="200" cy="200" r="66" fill="none" stroke="#c39531" stroke-width="4"><animate attributeName="r" values="66;82;66" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite"/></circle></g>
<g class="in" style="animation-delay:.15s"><rect x="430" y="40" width="227" height="38" rx="8" fill="#c39531"/><text x="442" y="67" font-size="20" font-weight="800" fill="#fff" letter-spacing="1.5">SUBCAPÍTULO II</text></g>
<text class="in" style="animation-delay:.25s" x="430" y="140" font-size="53" font-weight="900" fill="#1a1917">Agentes físicos</text>
<text class="in" style="animation-delay:.35s" x="432" y="188" font-size="24" font-weight="600" fill="#6b6457">Lo que no se ve… pero sí te daña</text>
<g class="chip" style="animation-delay:0.5s"><rect x="430" y="228" width="483" height="42" rx="21" fill="#fff" stroke="#c39531" stroke-width="2.5"/>
<circle cx="452" cy="249" r="9" fill="#c39531"/><path d="M447 249 l4 4 l7 -8" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="472" y="257" font-size="21" font-weight="700" fill="#1a1917">Ruido · Temperatura · Vibración</text></g><g class="chip" style="animation-delay:0.85s"><rect x="430" y="282" width="378" height="42" rx="21" fill="#fff" stroke="#c39531" stroke-width="2.5"/>
<circle cx="452" cy="303" r="9" fill="#c39531"/><path d="M447 303 l4 4 l7 -8" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="472" y="311" font-size="21" font-weight="700" fill="#1a1917">Iluminación · Radiación</text></g><g class="chip" style="animation-delay:1.2s"><rect x="430" y="336" width="404" height="42" rx="21" fill="#fff" stroke="#c39531" stroke-width="2.5"/>
<circle cx="452" cy="357" r="9" fill="#c39531"/><path d="M447 357 l4 4 l7 -8" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="472" y="365" font-size="21" font-weight="700" fill="#1a1917">Todos se deben MONITOREAR</text></g>
</svg>