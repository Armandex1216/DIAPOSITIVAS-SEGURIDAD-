<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400">
<style>
text{font-family:'Montserrat','Segoe UI','Arial Black',Arial,sans-serif}
.in{animation:in .7s cubic-bezier(.2,.8,.2,1) both}
.chip{animation:chip .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes chip{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
.ic{transform-origin:200px 200px;animation:pop .8s cubic-bezier(.2,.8,.2,1) both}
</style>
<g class="ic"><circle cx="200" cy="200" r="170" fill="#fff" stroke="#c39531" stroke-width="6"/><circle cx="200" cy="200" r="150" fill="#d4402b" opacity=".08"/>
<rect x="176" y="70" width="48" height="200" rx="24" fill="#fff" stroke="#1a1917" stroke-width="6"/><circle cx="200" cy="290" r="40" fill="#d4402b" stroke="#1a1917" stroke-width="6"/>
<rect x="188" y="150" width="24" height="140" rx="12" fill="#d4402b"><animate attributeName="y" values="230;90;230" dur="4s" repeatCount="indefinite"/><animate attributeName="height" values="60;200;60" dur="4s" repeatCount="indefinite"/><animate attributeName="fill" values="#2f7fc1;#d4402b;#2f7fc1" dur="4s" repeatCount="indefinite"/></rect>
<circle cx="200" cy="290" r="28" fill="#d4402b"><animate attributeName="fill" values="#2f7fc1;#d4402b;#2f7fc1" dur="4s" repeatCount="indefinite"/></circle>
<g transform="translate(300 110)"><circle r="24" fill="#f4b400"/><line x1="0" y1="-34" x2="0" y2="-46" stroke="#f4b400" stroke-width="6" stroke-linecap="round" transform="rotate(0)"/><line x1="0" y1="-34" x2="0" y2="-46" stroke="#f4b400" stroke-width="6" stroke-linecap="round" transform="rotate(45)"/><line x1="0" y1="-34" x2="0" y2="-46" stroke="#f4b400" stroke-width="6" stroke-linecap="round" transform="rotate(90)"/><line x1="0" y1="-34" x2="0" y2="-46" stroke="#f4b400" stroke-width="6" stroke-linecap="round" transform="rotate(135)"/><line x1="0" y1="-34" x2="0" y2="-46" stroke="#f4b400" stroke-width="6" stroke-linecap="round" transform="rotate(180)"/><line x1="0" y1="-34" x2="0" y2="-46" stroke="#f4b400" stroke-width="6" stroke-linecap="round" transform="rotate(225)"/><line x1="0" y1="-34" x2="0" y2="-46" stroke="#f4b400" stroke-width="6" stroke-linecap="round" transform="rotate(270)"/><line x1="0" y1="-34" x2="0" y2="-46" stroke="#f4b400" stroke-width="6" stroke-linecap="round" transform="rotate(315)"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" additive="sum" repeatCount="indefinite"/><animate attributeName="opacity" values=".2;1;.2" dur="4s" repeatCount="indefinite"/></g>
<g transform="translate(100 120)" stroke="#2f7fc1" stroke-width="6" stroke-linecap="round"><line x1="0" y1="-30" x2="0" y2="30" transform="rotate(0)"/><line x1="0" y1="-30" x2="0" y2="30" transform="rotate(60)"/><line x1="0" y1="-30" x2="0" y2="30" transform="rotate(120)"/><animate attributeName="opacity" values="1;.2;1" dur="4s" repeatCount="indefinite"/></g></g>
<g class="in" style="animation-delay:.15s"><rect x="430" y="40" width="140" height="38" rx="8" fill="#d4402b"/><text x="442" y="67" font-size="20" font-weight="800" fill="#fff" letter-spacing="1.5">AGENTE 2</text></g>
<text class="in" style="animation-delay:.25s" x="430" y="140" font-size="38" font-weight="900" fill="#1a1917">Temperaturas extremas</text>
<text class="in" style="animation-delay:.35s" x="432" y="188" font-size="24" font-weight="600" fill="#6b6457">Frío de la altura · calor de planta</text>
<g class="chip" style="animation-delay:0.5s"><rect x="430" y="228" width="470" height="42" rx="21" fill="#fff" stroke="#d4402b" stroke-width="2.5"/>
<circle cx="452" cy="249" r="9" fill="#d4402b"/><path d="M447 249 l4 4 l7 -8" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="472" y="257" font-size="21" font-weight="700" fill="#1a1917">Abrígate en capas en la altura</text></g><g class="chip" style="animation-delay:0.85s"><rect x="430" y="282" width="505" height="42" rx="21" fill="#fff" stroke="#d4402b" stroke-width="2.5"/>
<circle cx="452" cy="303" r="9" fill="#d4402b"/><path d="M447 303 l4 4 l7 -8" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="472" y="311" font-size="21" font-weight="700" fill="#1a1917">Hidrátate y toma pausas en el calor</text></g><g class="chip" style="animation-delay:1.2s"><rect x="430" y="336" width="470" height="42" rx="21" fill="#fff" stroke="#d4402b" stroke-width="2.5"/>
<circle cx="452" cy="357" r="9" fill="#d4402b"/><path d="M447 357 l4 4 l7 -8" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="472" y="365" font-size="21" font-weight="700" fill="#1a1917">Mareo o escalofríos → avisa ya</text></g>
</svg>