<svg xmlns="http://www.w3.org/2000/svg" class="a102" viewBox="0 0 960 340" width="960" height="340"><style>
svg.a102 text{font-family:Montserrat,'Segoe UI','Arial Black',Arial,sans-serif}
.a102 .p{animation:a102p .7s cubic-bezier(.2,1.4,.4,1) both;transform-box:fill-box;transform-origin:center}
.a102 .u{animation:a102u .7s cubic-bezier(.2,.8,.2,1) both}
.a102 .f{animation:a102f 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.a102 .sh{animation:a102sh .18s linear infinite}
.a102 .sp{animation:a102sp 9s linear infinite;transform-box:fill-box;transform-origin:center}
.a102 .bl{animation:a102bl 1.2s ease-in-out infinite}
@keyframes a102p{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
@keyframes a102u{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes a102f{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes a102sh{0%{transform:translate(0,0)}25%{transform:translate(-3px,2px)}50%{transform:translate(3px,-1px)}75%{transform:translate(-2px,-2px)}}
@keyframes a102sp{to{transform:rotate(360deg)}}
@keyframes a102bl{0%,100%{opacity:1}50%{opacity:.35}}
</style>
