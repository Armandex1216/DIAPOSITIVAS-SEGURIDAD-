1917">tierra</text></g><g class="u" style="animation-delay:2.3s"><rect x="478" y="224" width="290" height="92" rx="14" fill="#fff" stroke="#d4402b" stroke-width="5"/><circle cx="500" cy="224" r="18" fill="#d4402b"/><text x="500" y="231" text-anchor="middle" font-size="20" font-weight="900" fill="#fff">5</text><text x="623.0" y="264" text-anchor="middle" font-size="19" font-weight="800" fill="#1a1917">Bloqueo y</text><text x="623.0" y="288" text-anchor="middle" font-size="19" font-weight="800" fill="#1a1917">señal</text></g></svg>