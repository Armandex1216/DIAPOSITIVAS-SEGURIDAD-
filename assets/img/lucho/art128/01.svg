<g class="p" style="animation-delay:0.3s"><g transform="translate(300 170)"><rect x="-150" y="-90" width="300" height="160" rx="14" fill="#f4c400" stroke="#1a1917" stroke-width="8"/><text y="-30" text-anchor="middle" font-size="40" font-weight="900" fill="#1a1917">⚠ PELIGRO</text><text y="20" text-anchor="middle" font-size="26" font-weight="900" fill="#1a1917">ZONA DE ALTO RIESGO</text><rect x="-8" y="70" width="16" height="90" fill="#8a8577"/></g></g><g class="p" style="animation-delay:1.6s"><g transform="translate(740 170) scale(1.4)"><ellipse cx="-34" rx="30" ry="22" fill="#fff" stroke="#1a1917" stroke-width="5"/><ellipse cx="34" rx="30" ry="22" fill="#fff" stroke="#1a1917" stroke-width="5"/><g><animateTransform attributeName="transform" type="translate" values="-8 0;8 0;-8 0" dur="2s" repeatCount="indefinite"/><circle cx="-34" r="10" fill="#1a1917"/><circle cx="34" r="10" fill="#1a1917"/></g></g></g><text class="u" style="animation-delay:2.0s" x="740" y="300" text-anchor="middle" font-size="24" font-weight="800" fill="#1a1917">Visible y estratégico</text></svg>