<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="assets/icons/icon-180.png"><meta name="theme-color" content="#1a1917">
<title>Diapositivas de Seguridad · U.M. Pallancata – Selene</title>
<link rel="stylesheet" href="assets/css/deck.css?v=20261113f">
<style>
html,body{overflow:auto;height:auto;background:#f7f2e8;color:#1a1917}
.top{position:sticky;top:0;z-index:5;background:rgba(247,242,232,.9);backdrop-filter:blur(10px);border-bottom:1px solid #ebe1cc}
.top .in{max-width:1400px;margin:0 auto;padding:16px 40px;display:flex;align-items:center;gap:24px}
.top img{height:54px;display:block}
.top .t{font-size:13px;letter-spacing:.32em;font-weight:800;color:#9a7422}
.top .t b{display:block;letter-spacing:0;font-size:22px;color:#1a1917;font-weight:900;margin-top:2px}
.search{margin-left:auto;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #e6dcc6;border-radius:14px;padding:10px 16px;min-width:300px}
.search input{border:0;outline:0;font:600 15px Montserrat,sans-serif;width:100%;background:transparent}
main{max-width:1400px;margin:0 auto;padding:34px 40px 80px}
.crumb{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;color:#8d8a83;margin-bottom:22px}
.crumb a{color:#9a7422;text-decoration:none;cursor:pointer}.crumb a:hover{text-decoration:underline}
h1{font-size:40px;font-weight:900;margin:0 0 26px;letter-spacing:-.01em}
h1 span{color:#c39531}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px 30px}
.fd{display:flex;align-items:center;gap:18px;padding:12px 14px;border-radius:18px;cursor:pointer;text-decoration:none;color:inherit;transition:background .25s,transform .25s}
.fd:hover{background:#fff;transform:translateY(-3px);box-shadow:0 14px 30px -18px rgba(90,60,10,.45)}
.ico{position:relative;width:96px;height:76px;flex:none}
.ico .back{position:absolute;inset:6px 0 0 0;border-radius:10px;background:linear-gradient(#d9b866,#c39531)}
.ico .back::before{content:"";position:absolute;left:0;top:-8px;width:40px;height:14px;border-radius:7px 7px 0 0;background:#d9b866}
.ico .ph{position:absolute;left:10px;right:10px;top:10px;height:44px;border-radius:5px;background:#fff center/cover;box-shadow:0 2px 6px rgba(0,0,0,.18);transform:rotate(-3deg)}
.ico .ph.doc{background:#fff;display:grid;place-items:center}
.ico .ph.doc::after{content:"";width:60%;height:5px;border-radius:3px;background:#e8dcc0;box-shadow:0 9px 0 #e8dcc0,0 18px 0 #efe6d2}
.ico .front{position:absolute;left:0;right:0;bottom:0;height:46px;border-radius:9px;background:linear-gradient(#e8cd86,#d3a843);box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.fd.empty .back,.fd.empty .back::before{background:#ddd3bf}.fd.empty .front{background:linear-gradient(#ebe3d3,#ddd3bf)}
.fd h3{margin:0;font-size:17px;font-weight:800;text-transform:none;line-height:1.25}
.fd p{margin:4px 0 0;font-size:14px;color:#8d8a83;font-weight:600}
.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:28px}
.dk{background:#fff;border-radius:22px;overflow:hidden;text-decoration:none;color:inherit;border:1px solid #ece3cf;transition:transform .3s,box-shadow .3s}
.dk:hover{transform:translateY(-6px);box-shadow:0 26px 50px -26px rgba(90,60,10,.55)}
.dk .th{aspect-ratio:16/9;background:center 30%/cover;position:relative}
.dk .th::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(18,16,12,.82),rgba(18,16,12,.15))}
.dk .th b{position:absolute;left:24px;bottom:20px;z-index:2;color:#fff;font-size:30px;font-weight:900;line-height:1.05;max-width:70%}
.dk .th b span{color:#e8c97f;display:block;font-size:15px;letter-spacing:.2em;margin-bottom:6px}
.dk .in{padding:18px 22px;display:flex;align-items:center;gap:14px}
.dk .in div{flex:1}.dk h3{margin:0;font-size:18px;font-weight:800}.dk p{margin:4px 0 0;font-size:14px;color:#8d8a83;font-weight:600}
.dk .go{background:#c39531;color:#1a1917;font-weight:800;padding:10px 16px;border-radius:12px;font-size:14px;white-space:nowrap}
.dkw{position:relative}.dk-menu{position:absolute;right:12px;top:12px;z-index:3;width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.92);font-size:22px;font-weight:900;cursor:pointer}
.dk-new{border:2px dashed #d9c79c;background:#fffdf7;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:280px;cursor:pointer;font-family:Montserrat,sans-serif;color:#1a1917}
.dk-new .plus{width:74px;height:74px;border-radius:50%;background:#c39531;color:#1a1917;font-size:44px;font-weight:900;display:grid;place-items:center;margin-bottom:14px}
.dk-new h3{margin:0;font-size:20px;font-weight:900}.dk-new p{margin:6px 16px 0;font-size:14px;color:#8d8a83;font-weight:600;text-align:center}
.nmodal{position:fixed;inset:0;background:rgba(20,18,14,.55);display:none;place-items:center;z-index:50;padding:20px}.nmodal.on{display:grid}
.nbox{background:#fff;border-radius:22px;padding:26px 28px;width:min(520px,94vw);display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 80px -20px rgba(0,0,0,.6)}
.nbox h3{margin:0;font-size:24px;font-weight:900}.nsub{margin:-6px 0 0;color:#8d8a83;font-weight:600;font-size:14px}
.nbox label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:800;letter-spacing:.04em;color:#6c6960}
.nbox input,.nbox select{font:600 15px Montserrat,sans-serif;border:1px solid #e2d8c2;border-radius:10px;padding:11px 12px;color:#1a1917}
.nbox .chk{flex-direction:row;align-items:flex-start;gap:10px;font-weight:600;letter-spacing:0;font-size:14px;color:#1a1917}.nbox .chk input{margin-top:3px}
.nerr{margin:0;min-height:18px;color:#b02a2a;font-weight:700;font-size:13px}
.nacts{display:flex;gap:10px;justify-content:flex-end}.nacts button{font:800 14px Montserrat,sans-serif;border:1px solid #e2d8c2;background:#fff;border-radius:12px;padding:11px 18px;cursor:pointer}
.nacts .ok{background:#c39531;border-color:#c39531}.nacts .del{color:#b02a2a;border-color:#f0caca}
.none{padding:60px;text-align:center;color:#8d8a83;font-weight:600;font-size:17px;background:#fff;border:2px dashed #e3d6b8;border-radius:22px}
.rlist{margin:0;padding:12px 14px 12px 30px;background:#faf6ee;border-radius:12px;max-height:200px;overflow:auto;font-size:14px}.rlist li{margin:3px 0}.rlist span{color:#8d8a83;font-size:12px;font-weight:700}
.rchoice{display:grid;gap:10px}.ropt{display:grid!important;grid-template-columns:auto 1fr;gap:4px 10px!important;align-items:center;border:1px solid #e2d8c2;border-radius:14px;padding:12px 14px;cursor:pointer;letter-spacing:0!important;color:#1a1917!important}
.ropt:has(input:checked){border-color:#c39531;background:#fffbf2}.ropt b{font-size:15px}.ropt span{grid-column:2;font-weight:600;color:#8d8a83;font-size:13px}.ropt select{grid-column:1/-1;margin-top:6px}
.keys{margin-top:44px;display:flex;flex-wrap:wrap;gap:10px 18px;color:#8d8a83;font-size:14px;font-weight:600}
.keys span b{display:inline-block;min-width:28px;text-align:center;padding:3px 8px;border-radius:7px;background:#fff;border:1px solid #e6dcc6;color:#1a1917;margin-right:6px}
@media (max-width:700px){.top .in{flex-wrap:wrap;padding:14px 18px}.search{min-width:0;width:100%}main{padding:24px 18px}}
</style>
</head>
<body data-nohome="1">
<header class="top"><div class="in">
  <img src="assets/img/logo-hochschild.png" alt="Hochschild">
  <div class="t">U.M. PALLANCATA · SELENE<b>Diapositivas de Seguridad</b></div>
  <label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9a7422" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="q" placeholder="Buscar carpeta o presentación"></label>
</div></header>
<main>
  <nav class="crumb" id="crumb"></nav>
  <h1 id="ttl"></h1>
  <div id="view"></div>
  <div class="nmodal" id="nmodal"></div>
  <div class="keys"><span><b>→</b>siguiente</span><span><b>←</b>anterior</span><span><b>F</b>pantalla completa</span><span><b>O</b>láminas</span><span><b>E</b>editar</span><span><b>M</b>mover</span><span><b>P</b>PDF</span></div>
</main>
<script src="data/catalogo.js?v=20261110b"></script>
<script src="data/nube.js?v=1" onerror="void 0"></script>
<script>
(function () {
  const C = window.CATALOGO || [], P = window.PLANTILLAS || { blanco: { nombre: 'En blanco', archivo: 'blanco.html', titulo: 'Nueva presentación' } }, N = window.NUBE || {}, $ = s => document.querySelector(s), esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const api = (path, opt = {}) => fetch(N.url + '/rest/v1/' + path, Object.assign({}, opt, { headers: Object.assign({ apikey: N.key, Authorization: 'Bearer ' + N.key, 'Content-Type': 'application/json' }, opt.headers || {}) })).then(async r => { if (!r.ok) throw new Error(await r.text()); return r.status === 204 ? null : r.json().catch(() => null); });
  const cloud = !!(N.url && N.key);
  let DECKS = []; try { DECKS = JSON.parse(localStorage.getItem('decks-cache') || '[]'); } catch (e) { }
  const fdate = d => { if (!d) return ''; const [y, m, dd] = d.split('-'); return `${dd}/${m}/${y}`; };
  const dayName = d => d ? ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'][new Date(d + 'T12:00:00').getDay()] : '';
  const itemsOf = f => [...DECKS.filter(d => d.carpeta === f.id).map(d => ({ titulo: d.titulo, fecha: d.fecha ? dayName(d.fecha)[0].toUpperCase() + dayName(d.fecha).slice(1) + ' ' + fdate(d.fecha) : '', archivo: (P[d.plantilla] || P.blanco).archivo + '?d=' + encodeURIComponent(d.id), deck: d.id, cloud: d, laminas: (P[d.plantilla] || {}).laminas, portada: f.portada || 'assets/img/portada.jpg' })), ...f.items];
  const MESES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Setiembre', 'Octubre', 'Noviembre', 'Diciembre'];
  const n = f => { const k = itemsOf(f).length; return k === 1 ? '1 elemento' : k + ' elementos'; };
  const folder = f => { const has = itemsOf(f).length; return `<a class="fd ${has ? '' : 'empty'}" href="#${f.id}"><div class="ico"><div class="back"></div><div class="ph ${f.portada && has ? '' : 'doc'}" style="${f.portada && has ? `background-image:url(${f.portada})` : ''}"></div><div class="front"></div></div><div><h3>${esc(f.nombre)}</h3><p>${n(f)}</p></div></a>`; };
  const deck = d => `<div class="dkw"><a class="dk" href="${d.archivo}"><div class="th" style="background-image:url(${d.portada || 'assets/img/portada.jpg'})"><b><span>${esc(d.fecha)}</span>${esc(d.titulo)}</b></div><div class="in"><div><h3>${esc(d.titulo)}</h3><p>${esc(d.fecha)}${d.laminas ? ' · ' + d.laminas + ' láminas' : ''}</p></div><span class="go">Abrir ▶</span></div></a>${d.cloud ? `<button class="dk-menu" data-menu="${esc(d.deck)}" title="Opciones">⋯</button>` : ''}</div>`;
  const newCard = f => `<button class="dk dk-new" data-new="${f.id}"><div class="plus">＋</div><h3>Nueva presentación</h3><p>Plantilla: ${esc((P[f.plantilla] || P.blanco).nombre)}</p></button>`;
  function render() {
    const path = decodeURIComponent(location.hash.slice(1)).split('&')[0].split('/'), id = path[0], f = C.find(x => x.id === id), q = $('#q').value.trim().toLowerCase();
    if (f && f.anual) { // carpeta por año › mes › presentaciones (reporte diario)
      const all = itemsOf(f), raw = d => (d.cloud && d.cloud.fecha) || '', now = new Date(), Y = String(now.getFullYear()), M = String(now.getMonth() + 1).padStart(2, '0');
      const [, y, mo] = path; let crumb = `<a href="#">Inicio</a><span>›</span>` + (y ? `<a href="#${f.id}">${esc(f.nombre)}</a>` : `<span>${esc(f.nombre)}</span>`);
      const sub = (href, name, k) => `<a class="fd ${k ? '' : 'empty'}" href="#${href}"><div class="ico"><div class="back"></div><div class="ph ${f.portada && k ? '' : 'doc'}" style="${f.portada && k ? `background-image:url(${f.portada})` : ''}"></div><div class="front"></div></div><div><h3>${esc(name)}</h3><p>${k === 1 ? '1 elemento' : k + ' elementos'}</p></div></a>`;
      if (!y) { const ys = [...new Set([Y, ...all.map(d => raw(d).slice(0, 4)).filter(Boolean)])].sort().reverse();
        $('#ttl').innerHTML = esc(f.nombre); $('#view').innerHTML = `<div class="grid">${ys.map(v => sub(`${f.id}/${v}`, v, all.filter(d => raw(d).startsWith(v)).length)).join('')}</div>`; }
      else if (!mo) { crumb += `<span>›</span><span>${esc(y)}</span>`; const ms = [...new Set([...(y === Y ? [M] : []), ...all.filter(d => raw(d).startsWith(y)).map(d => raw(d).slice(5, 7))])].sort().reverse();
        $('#ttl').innerHTML = `${esc(f.nombre)} <span>${esc(y)}</span>`; $('#view').innerHTML = `<div class="grid">${ms.map(v => sub(`${f.id}/${y}/${v}`, MESES[+v - 1].toUpperCase(), all.filter(d => raw(d).startsWith(y + '-' + v)).length)).join('')}</div>`; }
      else { crumb += `<span>›</span><a href="#${f.id}/${y}">${esc(y)}</a><span>›</span><span>${MESES[+mo - 1]}</span>`; $('#ttl').innerHTML = `${esc(f.nombre)} <span>${MESES[+mo - 1]} ${esc(y)}</span>`;
        $('#view').innerHTML = `<div class="decks">${newCard(f)}${all.filter(d => raw(d).startsWith(y + '-' + mo)).sort((a, b) => raw(b).localeCompare(raw(a))).map(deck).join('')}</div>`; }
      $('#crumb').innerHTML = crumb;
    } else if (f) {
      $('#crumb').innerHTML = `<a href="#">Inicio</a><span>›</span><span>${esc(f.nombre)}</span>`; $('#ttl').innerHTML = esc(f.nombre);
      $('#view').innerHTML = `<div class="decks">${newCard(f)}${itemsOf(f).map(deck).join('')}</div>`;
    } else if (q) {
      const fs = C.filter(x => x.nombre.toLowerCase().includes(q)), ds = C.flatMap(itemsOf).filter(d => (d.titulo + ' ' + d.fecha).toLowerCase().includes(q));
      $('#crumb').innerHTML = `<a href="#">Inicio</a><span>›</span><span>Búsqueda</span>`; $('#ttl').innerHTML = `Resultados para <span>“${esc(q)}”</span>`;
      $('#view').innerHTML = (fs.length ? `<div class="grid">${fs.map(folder).join('')}</div>` : '') + (ds.length ? `<div class="decks" style="margin-top:30px">${ds.map(deck).join('')}</div>` : '') || `<div class="none">No se encontró nada.</div>`;
    } else {
      $('#crumb').innerHTML = `<span>Inicio</span>`; $('#ttl').innerHTML = `Carpetas de <span>presentaciones</span>`;
      $('#view').innerHTML = `<div class="grid">${C.map(folder).join('')}</div>`;
    }
  }
  async function loadDecks() {
    if (!cloud) return;
    try { DECKS = await api('diapo_decks?borrado=eq.false&select=*&order=fecha.desc.nullslast,creado.desc') || []; localStorage.setItem('decks-cache', JSON.stringify(DECKS)); render(); } catch (e) { console.warn('Sin conexión: se muestran las presentaciones guardadas en este equipo', e); }
  }
  /* ---------- crear presentación ---------- */
  const nextDay = dow => { const d = new Date(); d.setHours(12); if (dow == null) return d.toISOString().slice(0, 10); if (dow === 'm') { d.setDate(d.getDate() + 1); return d.toISOString().slice(0, 10); } const add = (dow - d.getDay() + 7) % 7; d.setDate(d.getDate() + add); return d.toISOString().slice(0, 10); };
  const GUM_OCULTAS = ['g-estad', 'g-acuerdos', 'g-hall', 'g-abiertos', 'g-s-retraso', 'g-resumen', 'g-oto', 'g-insp'];
  function openNew(folderId, importId) {
    const f = C.find(x => x.id === folderId) || C[0]; const m = $('#nmodal');
    m.innerHTML = `<form class="nbox"><h3>Nueva presentación</h3><p class="nsub">Carpeta: <b>${esc(f.nombre)}</b>${importId ? ' · con las estadísticas enviadas desde Safety HOC' : ''}</p>
      <label>Plantilla<select name="p">${Object.entries(P).map(([k, v]) => `<option value="${k}" ${k === f.plantilla ? 'selected' : ''}>${esc(v.nombre)}</option>`).join('')}</select></label>
      <label>Fecha de la reunión<input type="date" name="fecha" required></label>
      <label>Título<input name="t" required maxlength="120"></label>
      <label class="chk"><input type="checkbox" name="copy" checked> Copiar el contenido de la última presentación de esta carpeta (tablas, textos e imágenes) para solo actualizarla</label>
      <p class="nerr"></p><div class="nacts"><button type="button" data-x>Cancelar</button><button class="ok">Crear y abrir</button></div></form>`;
    const fm = $('form', m), sync = () => { const pl = P[fm.p.value] || P.blanco; fm.fecha.value = fm.fecha.value || nextDay(pl.dia); fm.t.value = `${pl.titulo} · ${fdate(fm.fecha.value)}`; };
    fm.p.onchange = () => { fm.fecha.value = ''; sync(); }; fm.fecha.onchange = () => { const pl = P[fm.p.value] || P.blanco; fm.t.value = `${pl.titulo} · ${fdate(fm.fecha.value)}`; }; sync();
    const prev = itemsOf(f).sort((a, b) => ((b.cloud || {}).fecha || '').localeCompare((a.cloud || {}).fecha || ''))[0]; if (prev && f.plantilla === 'diario') fm.copy.checked = false; if (!prev) { fm.copy.checked = false; fm.copy.closest('label').style.display = 'none'; }
    const copyTxt = () => { const lab = fm.copy.closest('label'); lab.lastChild.textContent = fm.p.value === 'diario' ? ' Copiar los textos del último reporte diario (responsables, tabla de hallazgos, etc.). Las fotos no se copian: cada día se ponen las nuevas.' : fm.p.value === 'gum' ? ' Copiar los acuerdos y pedidos del CSST (y textos) de la última GUM para solo actualizarlos. La GUM empieza con portada, momento ambiental, índices por unidad, pedidos del CSST del mes, campaña del mes y cierre; los gráficos de Safety HOC se agregan después.' : ' Copiar el contenido de la última presentación de esta carpeta (tablas, textos e imágenes) para solo actualizarla'; };
    fm.p.addEventListener('change', copyTxt); copyTxt();
    m.classList.add('on'); $('[data-x]', m).onclick = () => m.classList.remove('on');
    fm.onsubmit = async e => { e.preventDefault(); const err = $('.nerr', m); if (!cloud) { err.textContent = 'La nube no está configurada.'; return; }
      if (!navigator.onLine) { err.textContent = 'Necesita internet para crear una presentación nueva.'; return; }
      const pl = fm.p.value, fecha = fm.fecha.value, id = `${pl}-${fecha.replace(/-/g, '')}-${Math.random().toString(36).slice(2, 6)}`;
      err.textContent = 'Creando…';
      try {
        await api('diapo_decks', { method: 'POST', headers: { Prefer: 'return=minimal' }, body: JSON.stringify({ id, carpeta: f.id, plantilla: pl, titulo: fm.t.value.trim(), fecha }) });
        const src = prev && fm.copy.checked ? prev : null; let data = null;
        if (src && src.deck && (!src.cloud || src.cloud.plantilla === pl) && !(src.archivo || '').startsWith('gum-octubre')) {
          const rows = await api(`diapo_cambios?deck_id=eq.${encodeURIComponent(src.deck)}&select=data`);
          if (rows && rows[0]) { data = rows[0].data || {}; data.meta = data.meta && Array.isArray(data.meta.orden) ? { orden: data.meta.orden } : {}; }
        }
        // GUM nueva: vacía (portada, acuerdos del CSST y cierre). De la anterior solo se copian textos y tablas (acuerdos), no gráficos ni láminas agregadas.
        if (pl === 'gum') {
          data = data || {}; data.meta = {}; data.slides = {}; data.free = {}; data.charts = {};
          data.layout = Object.fromEntries(Object.entries(data.layout || {}).filter(([k]) => !k.startsWith('free:') && !k.startsWith('x')));
          data.images = Object.fromEntries(Object.entries(data.images || {}).filter(([k]) => !k.startsWith('free-') && !k.includes('@x')));
          data.hidden = Object.fromEntries(GUM_OCULTAS.map(k => [k, true]));
          ['g-idx-pal', 'g-idx-sel', 'g-pedidos', 'g-campana'].forEach(k => data.hidden[k] = false); // índices por unidad, acta y campaña del mes
        }
        if (pl === 'diario' && data) { data.images = {}; data.free = Object.fromEntries(Object.entries(data.free || {}).filter(([, v]) => v.t !== 'img')); data.meta = {}; } // el diario nuevo no arrastra las fotos del anterior
        if (data) await api('diapo_cambios', { method: 'POST', headers: { Prefer: 'return=minimal' }, body: JSON.stringify({ deck_id: id, data, updated_at: new Date().toISOString(), updated_by: src ? 'copia' : 'nueva' }) });
        location.href = `${(P[pl] || P.blanco).archivo}?d=${encodeURIComponent(id)}&fecha=${fecha}${importId ? '&importar=' + encodeURIComponent(importId) : ''}`;
      } catch (ex) { console.error(ex); err.textContent = 'No se pudo crear: ' + ex.message.slice(0, 160); }
    };
  }
  /* ---------- renombrar / eliminar ---------- */
  function menu(id, btn) {
    const d = DECKS.find(x => x.id === id); if (!d) return; const m = $('#nmodal');
    m.innerHTML = `<form class="nbox"><h3>${esc(d.titulo)}</h3><label>Título<input name="t" value="${esc(d.titulo)}" maxlength="120"></label><label>Fecha<input type="date" name="fecha" value="${d.fecha || ''}"></label><p class="nerr"></p>
      <div class="nacts"><button type="button" class="del" data-del>🗑 Eliminar</button><span style="flex:1"></span><button type="button" data-x>Cancelar</button><button class="ok">Guardar</button></div></form>`;
    m.classList.add('on'); const fm = $('form', m); $('[data-x]', m).onclick = () => m.classList.remove('on');
    fm.onsubmit = async e => { e.preventDefault(); try { await api(`diapo_decks?id=eq.${encodeURIComponent(id)}`, { method: 'PATCH', headers: { Prefer: 'return=minimal' }, body: JSON.stringify({ titulo: fm.t.value.trim(), fecha: fm.fecha.value || null }) }); m.classList.remove('on'); loadDecks(); } catch (ex) { $('.nerr', m).textContent = 'No se pudo guardar.'; } };
    $('[data-del]', m).onclick = async () => { if (!confirm('¿Eliminar «' + d.titulo + '»? Dejará de aparecer en la carpeta.')) return; try { await api(`diapo_decks?id=eq.${encodeURIComponent(id)}`, { method: 'PATCH', headers: { Prefer: 'return=minimal' }, body: JSON.stringify({ borrado: true }) }); m.classList.remove('on'); DECKS = DECKS.filter(x => x.id !== id); render(); loadDecks(); } catch (ex) { $('.nerr', m).textContent = 'No se pudo eliminar.'; } };
  }
  document.addEventListener('click', e => {
    const nb = e.target.closest('[data-new]'); if (nb) { e.preventDefault(); openNew(nb.dataset.new); return; }
    const mb = e.target.closest('[data-menu]'); if (mb) { e.preventDefault(); menu(mb.dataset.menu, mb); return; }
    if (e.target.id === 'nmodal') e.target.classList.remove('on');
  });
  addEventListener('hashchange', () => { $('#q').value = ''; render(); scrollTo(0, 0); }); $('#q').addEventListener('input', render);
  render(); loadDecks();
  /* ---------- llegada desde Safety HOC: #enviar&importar=<id> (o #gum&importar=<id>) ---------- */
  async function receive(importId) {
    const m = $('#nmodal'); let info = null;
    try { const r = await api(`diapo_importaciones?id=eq.${encodeURIComponent(importId)}&select=periodo,tipo,data`); info = r && r[0]; } catch (e) { }
    const g = (info && info.data && info.data.graficos) || [], isGum = !!(info && info.data && info.data.destino === 'gum');
    const all = C.flatMap(f => itemsOf(f).map(d => ({ ...d, carpeta: f.nombre, fid: f.id }))).sort((a, b) => isGum ? (b.fid === 'gum') - (a.fid === 'gum') : 0);
    m.innerHTML = `<form class="nbox"><h3>${isGum ? 'Para la Reunión GUM: ' : 'Llegaron '}${g.length ? g.length + ' gráfico' + (g.length > 1 ? 's' : '') : 'estadísticas'} de Safety HOC</h3>
      <p class="nsub">${info ? 'Periodo: <b>' + esc(info.periodo || '') + '</b>' : 'No se pudo leer el envío; revise la conexión.'}</p>
      ${g.length ? `<ul class="rlist">${g.slice(0, 8).map(x => `<li><b>${esc(x.titulo)}</b> <span>${esc(x.subtitulo || '')}</span></li>`).join('')}${g.length > 8 ? `<li>… y ${g.length - 8} más</li>` : ''}</ul>` : ''}
      <p class="nsub">${isGum ? 'Llenan los gráficos y comentarios de la plantilla GUM; los que la GUM no tiene se agregan como láminas nuevas.' : 'Cada gráfico se agrega como una lámina nueva, con sus datos editables.'}</p>
      <div class="rchoice"><label class="ropt"><input type="radio" name="w" value="new" checked><b>${isGum ? 'GUM nueva' : 'Presentación nueva'}</b><span>${isGum ? 'Plantilla Reunión GUM, con la fecha del próximo martes' : 'Elija la carpeta y la plantilla'}</span>
        <select name="f">${C.map(f => `<option value="${f.id}" ${f.id === 'gum' ? 'selected' : ''}>${esc(f.nombre)}</option>`).join('')}</select></label>
      <label class="ropt"><input type="radio" name="w" value="old" ${all.length ? '' : 'disabled'}><b>${isGum ? 'Actualizar una GUM que ya existe' : 'Agregar a una que ya existe'}</b><span>${all.length ? 'Se agregan antes de la lámina de cierre' : 'Todavía no hay presentaciones'}</span>
        <select name="d">${all.map((d, i) => `<option value="${i}">${esc(d.carpeta)} · ${esc(d.titulo)}${d.fecha ? ' · ' + esc(d.fecha) : ''}</option>`).join('')}</select></label></div>
      <p class="nerr"></p><div class="nacts"><button type="button" data-x>Cancelar</button><button class="ok">Continuar</button></div></form>`;
    m.classList.add('on'); const fm = $('form', m);
    $('[data-x]', m).onclick = () => { m.classList.remove('on'); history.replaceState(null, '', location.pathname); };
    fm.f.onfocus = () => fm.w.value = 'new'; fm.d.onfocus = () => { if (all.length) fm.w.value = 'old'; };
    fm.onsubmit = e => { e.preventDefault();
      if (fm.w.value === 'old') { const d = all[+fm.d.value]; if (!d) return; location.href = d.archivo + (d.archivo.includes('?') ? '&' : '?') + 'importar=' + encodeURIComponent(importId); }
      else openNew(fm.f.value, importId); };
  }
  const hk = location.hash.slice(1).split('&'), hp = new URLSearchParams(hk.slice(1).join('&'));
  if (hp.get('importar')) { if (hk[0] === 'enviar') loadDecks().finally(() => receive(hp.get('importar'))); else openNew(hk[0] || 'gum', hp.get('importar')); }
})();
</script>
<script>if("serviceWorker" in navigator && /^https?:/.test(location.protocol)){let had=!!navigator.serviceWorker.controller,done=false;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(had&&!done){done=true;location.reload()}});addEventListener("load",()=>navigator.serviceWorker.register("sw.js").then(r=>r.update()).catch(()=>{}))}</script>
</body>
</html>
